# config/services.yaml

parameters:
    lesson_upload_base: "%kernel.project_dir%/public/uploads/lessons"
    lesson_upload_public_base: "/uploads/lessons"
    # Only need the API key now - URL is hardcoded in the service
    huggingface_api_key: '%env(HUGGINGFACE_API_KEY)%'
    groq_api_key: '%env(GROQ_API_KEY)%'
    groq_model_id: '%env(GROQ_MODEL_ID)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\ModerationService:
        arguments:
            $huggingFaceApiKey: '%huggingface_api_key%'

    App\Service\AIGeneratorService:
        arguments:
            $groqApiKey: '%groq_api_key%'
            $groqModelId: '%groq_model_id%'

    # Translation Service - Updated to only need API key
    App\Service\TranslationService:
        arguments:
            $httpClient: '@http_client'
            $logger: '@logger'
            $hfKey: '%huggingface_api_key%'

    # Translation Controller
    App\Controller\TranslationController:
        arguments:
            $translationService: '@App\Service\TranslationService'
            $connection: '@doctrine.dbal.default_connection'
            $logger: '@logger'  
    
    App\Twig\TimeAgoExtension:
        tags: ['twig.extension']